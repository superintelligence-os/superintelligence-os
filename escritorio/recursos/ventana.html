<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>SIOS Desktop</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@font-face { font-family: "Montserrat"; src: url(/montserrat.ttf); font-weight: 100 900; }
:root {
  color-scheme: dark;
  --fondo: #121211; --lateral: #171716; --superficie: #1c1c1b; --superficie-2: #252524; --superficie-3: #2f2f2d;
  --borde: #2a2a28; --borde-2: #3a3a37; --texto: #F4F1EA; --texto-2: #BAB7AE; --texto-3: #7E7C75;
  --acento: #7B6CF6; --acento-2: color-mix(in srgb, var(--acento) 16%, transparent);
  --verde: #5DBB7E; --rojo: #E5776A; --radio: 18px;
  --muelle: cubic-bezier(.34, 1.56, .64, 1); --suave: cubic-bezier(.2, .8, .2, 1);
}
@media (prefers-color-scheme: light) {
  :root { color-scheme: light; --fondo: #F7F6F2; --lateral: #EFEDE6; --superficie: #FFFFFF; --superficie-2: #F2F0EA; --superficie-3: #E8E5DC;
    --borde: #E5E2D9; --borde-2: #D3CFC4; --texto: #141413; --texto-2: #45443F; --texto-3: #7A786F; --verde: #3F8B5C; --rojo: #C64545; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font: 400 14px/1.45 "Montserrat", system-ui, sans-serif; background: var(--fondo); color: var(--texto); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; }
::selection { background: var(--acento-2); }
.oculto { display: none !important; }
svg.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- Estructura ---------- */
.app { display: grid; grid-template-columns: 252px 1fr; height: 100vh; }
.lateral { background: var(--lateral); border-right: 1px solid var(--borde); display: flex; flex-direction: column; padding: 22px 14px 16px; gap: 20px; min-height: 0; }
.marca { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.marca svg { width: 28px; height: 28px; }
.marca b { font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
.marca span { color: var(--texto-3); font-weight: 500; }
.sios .anillo { stroke: var(--texto); }
.sios .punto { fill: var(--acento); transition: fill .8s var(--suave); }

.movil-mini { background: var(--superficie); border: 1px solid var(--borde); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.movil-mini .fila { display: flex; align-items: center; gap: 10px; }
.movil-mini .icono-movil { width: 34px; height: 34px; border-radius: 10px; background: var(--acento-2); color: var(--acento); display: grid; place-items: center; flex: none; }
.movil-mini b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.estado-linea { display: flex; align-items: flex-start; gap: 6px; color: var(--texto-3); font-size: 12px; line-height: 17px; }
/* El punto no se encoge aunque el texto ocupe dos líneas (si no, se ve ovalado) y va a la altura de la primera. */
.estado-linea i { flex: none; margin-top: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--texto-3); transition: background .4s; }
.estado-linea.si i { background: var(--verde); box-shadow: 0 0 0 3px color-mix(in srgb, var(--verde) 20%, transparent); }
.bateria { height: 4px; border-radius: 2px; background: var(--superficie-3); overflow: hidden; }
.bateria i { display: block; height: 100%; width: 100%; background: var(--verde); border-radius: 2px; transform: scaleX(0); transform-origin: left; transition: transform .8s var(--suave); }

nav { display: flex; flex-direction: column; gap: 2px; }
nav button { all: unset; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 11px; cursor: pointer; color: var(--texto-2); font-weight: 500; position: relative; transition: background .25s var(--suave), color .25s; }
nav button:hover { background: var(--superficie-2); color: var(--texto); }
nav button.activo { background: var(--superficie-2); color: var(--texto); }
nav button.activo::before { content: ""; position: absolute; left: -14px; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--acento); }
nav button.activo svg { color: var(--acento); }
nav .insignia { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--acento); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.lateral .pie { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
.ia-en-uso { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--acento-2); cursor: pointer; transition: transform .3s var(--muelle); }
.ia-en-uso:hover { transform: translateY(-1px); }
.ia-en-uso .logo { width: 26px; height: 26px; display: grid; place-items: center; }
.ia-en-uso .logo svg { width: 18px; height: 18px; fill: var(--acento); }
.ia-en-uso small { display: block; color: var(--texto-3); font-size: 11px; }
.ia-en-uso b { font-weight: 600; font-size: 13px; }
.equipo { color: var(--texto-3); font-size: 11px; padding: 0 12px; }

main { overflow: auto; min-height: 0; scroll-behavior: smooth; }
.vista { max-width: 1080px; margin: 0 auto; padding: 38px 44px 60px; animation: vista .5s var(--suave) both; }
@keyframes vista { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.titulo-vista { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 26px; }
.titulo-vista h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -.02em; }
.titulo-vista p { margin: 6px 0 0; color: var(--texto-3); }

/* ---------- Piezas ---------- */
.tarjeta { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); padding: 22px; }
.tarjeta h2 { margin: 0; font-size: 16px; font-weight: 600; }
.tarjeta .cab-t { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.tarjeta .cab-t a, .enlace-txt { color: var(--acento); font-weight: 600; font-size: 13px; cursor: pointer; text-decoration: none; }
.rejilla-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.suave { color: var(--texto-3); font-size: 13px; }
.etiqueta-g { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--texto-3); }
.boton { appearance: none; border: 0; height: 42px; padding: 0 18px; border-radius: 12px; font-weight: 600; font-size: 14px; background: var(--acento); color: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .25s var(--muelle), filter .2s, opacity .2s; white-space: nowrap; }
.boton:hover { filter: brightness(1.08); }
.boton:active { transform: scale(.97); }
.boton:disabled { opacity: .5; cursor: default; }
.boton.sec { background: var(--superficie-2); color: var(--texto); }
.boton.sec:hover { background: var(--superficie-3); filter: none; }
.boton.peligro { background: transparent; color: var(--rojo); border: 1px solid color-mix(in srgb, var(--rojo) 40%, transparent); }
.boton.ancho { width: 100%; }
.campo { width: 100%; height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--borde-2); background: var(--fondo); color: var(--texto); font: inherit; outline: none; transition: border-color .2s, box-shadow .2s; }
.campo:focus { border-color: var(--acento); box-shadow: 0 0 0 4px var(--acento-2); }
textarea.campo { height: 92px; padding: 12px 14px; resize: none; }
.fila-campo { display: flex; gap: 10px; }
.fila-campo .campo { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 99px; background: var(--superficie-2); color: var(--texto-2); font-size: 12px; font-weight: 600; }
.chip.ok { background: color-mix(in srgb, var(--verde) 16%, transparent); color: var(--verde); }
.chip.acento { background: var(--acento-2); color: var(--acento); }
.chip.mal { background: color-mix(in srgb, var(--rojo) 14%, transparent); color: var(--rojo); }
.chip svg { width: 14px; height: 14px; fill: currentColor; }

/* Inicio */
.hero { display: grid; grid-template-columns: 1.15fr 1fr; gap: 16px; margin-bottom: 16px; }
.hero .movil { display: flex; flex-direction: column; gap: 18px; position: relative; overflow: hidden; }
.hero .movil::after { content: ""; position: absolute; right: -80px; top: -80px; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, var(--acento-2), transparent 70%); pointer-events: none; }
.hero h2 { font-size: 26px; letter-spacing: -.02em; }
.hero .chips { display: flex; flex-wrap: wrap; gap: 8px; }
.acciones-rapidas { display: flex; gap: 10px; flex-wrap: wrap; margin-top: auto; }
.soltar { border: 1.5px dashed var(--borde-2); border-radius: var(--radio); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 26px; cursor: pointer; color: var(--texto-3); transition: border-color .25s, background .25s, transform .35s var(--muelle); min-height: 210px; }
.soltar:hover, .soltar.encima { border-color: var(--acento); background: var(--acento-2); color: var(--texto-2); }
.soltar.encima { transform: scale(1.015); }
.soltar .circulo { width: 52px; height: 52px; border-radius: 50%; background: var(--superficie-2); display: grid; place-items: center; color: var(--acento); }
.soltar b { color: var(--texto); font-size: 15px; }

/* Mensajes */
.mensajes { display: flex; flex-direction: column; gap: 10px; }
.mensaje { padding: 14px 16px; border-radius: 14px; background: var(--superficie-2); display: flex; flex-direction: column; gap: 6px; animation: vista .4s var(--suave) both; }
.mensaje .cab2 { display: flex; align-items: baseline; gap: 8px; }
.mensaje .de { font-weight: 600; }
.mensaje .app { color: var(--texto-3); font-size: 12px; }
.mensaje .hora { margin-left: auto; color: var(--texto-3); font-size: 12px; }
.mensaje .txt { color: var(--texto-2); white-space: pre-wrap; overflow-wrap: anywhere; }
.mensaje form { display: flex; gap: 8px; margin-top: 4px; }
.mensaje form .campo { height: 38px; background: var(--superficie); }
.mensaje form .boton { height: 38px; }
.mensaje .hecho { color: var(--verde); font-size: 12px; font-weight: 600; }
.vacio-bonito { padding: 34px 20px; text-align: center; color: var(--texto-3); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.vacio-bonito .circulo { width: 46px; height: 46px; border-radius: 50%; background: var(--superficie-2); display: grid; place-items: center; }
.contacto { position: relative; }
.sugerencias { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--superficie); border: 1px solid var(--borde-2); border-radius: 12px; padding: 6px; z-index: 5; box-shadow: 0 16px 40px rgba(0,0,0,.35); }
.sugerencia { all: unset; display: flex; justify-content: space-between; width: 100%; box-sizing: border-box; padding: 9px 10px; border-radius: 8px; cursor: pointer; }
.sugerencia:hover, .sugerencia.activa { background: var(--superficie-2); }
.sugerencia span:last-child { color: var(--texto-3); font-variant-numeric: tabular-nums; }
.componer { display: flex; flex-direction: column; gap: 10px; }
.componer .acciones { display: flex; gap: 10px; justify-content: flex-end; }

/* Panel (tarjetas del móvil) */
.rejilla { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 168px; grid-auto-flow: dense; gap: 12px; }
.w { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); padding: 16px; overflow: hidden; display: flex; flex-direction: column; gap: 8px; animation: entrar .45s var(--muelle) both; min-width: 0; }
.w.mediano { grid-column: span 2; }
.w.grande { grid-column: span 2; grid-row: span 2; }
.w .cab { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 600; letter-spacing: .8px; text-transform: uppercase; color: var(--texto-3); white-space: nowrap; overflow: hidden; }
.w .cab i { width: 6px; height: 6px; border-radius: 50%; background: var(--a, var(--acento)); flex: none; }
.w .cab b { overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.w .cifra { font-size: 40px; font-weight: 300; letter-spacing: -1.5px; line-height: 1.05; margin-top: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.w .cifra small { font-size: 16px; letter-spacing: 0; color: var(--texto-2); margin-left: 4px; font-weight: 400; }
.w .sub { color: var(--texto-3); font-size: 13px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.w .texto { color: var(--texto-2); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; }
.w .filas { display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
.w .fila2 { display: flex; gap: 10px; align-items: baseline; min-width: 0; }
.w .fila2 .h { color: var(--a, var(--acento)); font-size: 13px; flex: none; min-width: 44px; }
.w .fila2 .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.w .fila2 .v { color: var(--texto-2); flex: none; font-variant-numeric: tabular-nums; }
.w .barra { height: 6px; background: var(--superficie-2); border-radius: 3px; overflow: hidden; margin-top: 6px; }
.w .barra i { display: block; height: 100%; background: var(--a, var(--acento)); border-radius: 3px; }
.w .marcador { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; margin-top: auto; margin-bottom: auto; text-align: center; }
.w .marcador .goles { font-size: 32px; font-weight: 300; }
.w .marcador .eq { font-size: 13px; color: var(--texto-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.w .anillos { display: flex; gap: 12px; justify-content: center; align-items: center; margin: auto 0; }
.w svg.anillo { width: 72px; height: 72px; }
.w .grafico { margin-top: auto; width: 100%; height: 56px; }
.w .noticias { display: flex; flex-direction: column; overflow: hidden; }
.w .noticia { display: block; padding: 9px 0; border-top: 1px solid var(--borde); color: inherit; text-decoration: none; }
.w .noticia:first-child { border-top: 0; padding-top: 2px; }
.w .noticia .titular { font-weight: 500; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.w .noticia .fuente { color: var(--texto-3); font-size: 12px; margin-top: 2px; }
.w .noticia:hover .titular { color: var(--a, var(--acento)); }
.w .casilla { width: 16px; height: 16px; border-radius: 5px; border: 1.5px solid var(--borde); flex: none; align-self: center; }
.w .hecho .casilla { background: var(--a, var(--acento)); border-color: var(--a, var(--acento)); }
.w .hecho .t { color: var(--texto-3); text-decoration: line-through; }
.vacio { color: var(--texto-3); text-align: center; padding: 26px 0; font-size: 14px; }

.rejilla { grid-template-columns: repeat(4, 1fr); }
.rejilla.mini { grid-template-columns: 1fr 1fr; grid-auto-rows: 158px; }
.rejilla.mini .w { padding: 14px; }
.rejilla.mini .anillo { width: 64px; height: 64px; }
.rejilla.mini .w.grande { grid-row: span 1; }

/* Inteligencia */
.ia-hero { display: flex; align-items: center; gap: 22px; padding: 26px; border-radius: 22px; background: linear-gradient(135deg, var(--acento-2), transparent 70%), var(--superficie); border: 1px solid color-mix(in srgb, var(--acento) 30%, var(--borde)); margin-bottom: 28px; position: relative; overflow: hidden; }
.ia-hero .logo { width: 72px; height: 72px; border-radius: 22px; background: color-mix(in srgb, var(--acento) 18%, var(--superficie)); display: grid; place-items: center; flex: none; }
.ia-hero .logo svg { width: 38px; height: 38px; fill: var(--acento); }
.ia-hero h2 { font-size: 24px; margin: 4px 0 2px; letter-spacing: -.01em; }
.ia-hero .modelos { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.pastilla-modelo { all: unset; cursor: pointer; padding: 6px 12px; border-radius: 99px; background: var(--superficie-2); color: var(--texto-2); font-size: 12px; font-weight: 600; transition: background .25s, color .25s; }
.pastilla-modelo:hover { background: var(--superficie-3); }
.pastilla-modelo.si { background: var(--acento); color: #fff; }
.pestanas { display: inline-flex; padding: 4px; border-radius: 12px; background: var(--superficie-2); gap: 2px; margin-bottom: 18px; position: relative; }
.pestanas button { all: unset; cursor: pointer; padding: 8px 16px; border-radius: 9px; font-weight: 600; font-size: 13px; color: var(--texto-3); position: relative; z-index: 1; transition: color .25s; }
.pestanas button.si { color: var(--texto); }
.pestanas .marcador { position: absolute; top: 4px; bottom: 4px; border-radius: 9px; background: var(--superficie); box-shadow: 0 1px 3px rgba(0,0,0,.25); left: 0; transition: transform .45s var(--muelle), width .45s var(--muelle); }
.mosaico { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.tesela { all: unset; cursor: pointer; box-sizing: border-box; background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); padding: 18px; display: flex; flex-direction: column; gap: 14px; min-height: 150px; transition: transform .35s var(--muelle), border-color .25s, box-shadow .3s; animation: vista .45s var(--suave) both; }
.tesela:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--c) 45%, var(--borde)); box-shadow: 0 14px 34px -18px color-mix(in srgb, var(--c) 60%, transparent); }
.tesela .arriba { display: flex; align-items: center; justify-content: space-between; }
.tesela .logo { width: 44px; height: 44px; border-radius: 14px; background: color-mix(in srgb, var(--c) 16%, transparent); display: grid; place-items: center; }
.tesela .logo svg { width: 24px; height: 24px; fill: var(--c); }
.tesela b { font-size: 15px; font-weight: 600; }
.tesela p { margin: 4px 0 0; color: var(--texto-3); font-size: 12.5px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tesela.en-uso { border-color: color-mix(in srgb, var(--c) 60%, var(--borde)); }

/* Cajón lateral */
.velo { position: fixed; inset: 0; background: rgba(0,0,0,.4); opacity: 0; pointer-events: none; transition: opacity .35s var(--suave); z-index: 20; }
.velo.abierto { opacity: 1; pointer-events: auto; }
.cajon { position: fixed; top: 0; right: 0; bottom: 0; width: 440px; max-width: 92vw; background: var(--superficie); border-left: 1px solid var(--borde); z-index: 21; transform: translateX(105%); transition: transform .55s var(--muelle); display: flex; flex-direction: column; box-shadow: -30px 0 60px -30px rgba(0,0,0,.5); }
.cajon.abierto { transform: none; }
.cajon .cab-c { display: flex; align-items: center; gap: 14px; padding: 26px 26px 18px; border-bottom: 1px solid var(--borde); }
.cajon .cab-c .logo { width: 52px; height: 52px; border-radius: 16px; background: color-mix(in srgb, var(--c) 16%, transparent); display: grid; place-items: center; flex: none; }
.cajon .cab-c .logo svg { width: 28px; height: 28px; fill: var(--c); }
.cajon .cab-c h2 { margin: 0; font-size: 20px; }
.cajon .cerrar { all: unset; margin-left: auto; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; color: var(--texto-3); }
.cajon .cerrar:hover { background: var(--superficie-2); color: var(--texto); }
.cajon .cuerpo { padding: 22px 26px 30px; overflow: auto; display: flex; flex-direction: column; gap: 14px; }
.cajon .boton:not(.sec):not(.peligro) { background: var(--c); }
.codigo-grande { text-align: center; font-size: 34px; font-weight: 300; letter-spacing: .2em; padding: 18px; border-radius: 14px; border: 1px solid var(--c); background: color-mix(in srgb, var(--c) 6%, transparent); }
.modelo-local { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--superficie-2); }
.modelo-local .txt { flex: 1; min-width: 0; }
.modelo-local .txt b { display: block; font-weight: 600; }
.modelo-local .txt span { color: var(--texto-3); font-size: 12.5px; }
.modelo-local .boton { height: 34px; padding: 0 14px; font-size: 13px; }
.barra-p { height: 4px; border-radius: 2px; background: var(--superficie-3); overflow: hidden; margin-top: 8px; }
.barra-p i { display: block; height: 100%; width: 100%; background: var(--c); transform-origin: left; transition: transform .8s var(--suave); }
.aviso-ram { display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: 14px; background: color-mix(in srgb, var(--c) 10%, transparent); }
.aviso-ram b { font-size: 22px; font-weight: 600; color: var(--c); white-space: nowrap; }

/* Por cable */
.pasos-guia { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 18px; }
.paso-g { padding: 18px; border-radius: var(--radio); background: var(--superficie); border: 1px solid var(--borde); display: flex; gap: 12px; }
.paso-g .n { width: 28px; height: 28px; border-radius: 50%; background: var(--acento-2); color: var(--acento); font-weight: 700; display: grid; place-items: center; flex: none; font-size: 13px; }
.paso-g b { display: block; margin-bottom: 2px; }
.disp { display: flex; flex-direction: column; gap: 14px; }
.disp .cab-d { display: flex; align-items: center; gap: 14px; }
.disp .cab-d .icono-movil { width: 44px; height: 44px; border-radius: 13px; background: var(--superficie-2); display: grid; place-items: center; color: var(--texto-2); }
.disp .cab-d b { font-size: 16px; }
.comprobaciones { display: flex; flex-wrap: wrap; gap: 8px; }
.opciones-instalar { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
.opcion { padding: 18px; border-radius: 16px; background: var(--superficie-2); display: flex; flex-direction: column; gap: 10px; }
.opcion b { font-size: 15px; }
.opcion .boton.sec { background: var(--superficie-3); }
.opcion .boton { align-self: flex-start; }
.opcion .chip { align-self: flex-start; }
.registro { display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: 14px; background: var(--superficie-2); font-size: 13px; }
.registro div { display: flex; gap: 10px; color: var(--texto-2); animation: vista .35s var(--suave) both; }
.registro div::before { content: "✓"; color: var(--verde); font-weight: 700; }
.registro div.ultimo::before { content: ""; flex: none; width: 9px; height: 9px; margin: 4px 2px 0; border-radius: 50%; background: var(--acento); animation: latido 1s ease-in-out infinite alternate; }
.registro div.error::before { content: "!"; color: var(--rojo); }
.registro.numerados div::before { content: var(--n); width: 22px; height: 22px; border-radius: 50%; background: var(--acento-2); color: var(--acento); font-size: 12px; display: grid; place-items: center; flex: none; }
.registro.numerados div { align-items: center; color: var(--texto); }
.camino .boton { margin-top: auto; }
@keyframes latido { from { opacity: .35; transform: scale(.8); } to { opacity: 1; transform: scale(1.1); } }
.casillas { display: flex; flex-wrap: wrap; gap: 8px; }
.tarjeta > .boton:last-child { align-self: flex-start; }
.casilla-p { all: unset; cursor: pointer; padding: 9px 14px; border-radius: 12px; background: var(--superficie-2); font-weight: 500; font-size: 13px; display: flex; gap: 8px; align-items: center; transition: background .2s, color .2s; }
.casilla-p i { width: 16px; height: 16px; border-radius: 5px; border: 1.5px solid var(--borde-2); display: grid; place-items: center; transition: background .2s, border-color .2s; }
.casilla-p.si i { background: var(--acento); border-color: var(--acento); }
.casilla-p.si i::after { content: ""; width: 8px; height: 4px; border: 2px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.apps-lista { display: flex; flex-wrap: wrap; gap: 6px; }
.apps-lista button { all: unset; cursor: pointer; padding: 6px 11px; border-radius: 99px; background: var(--superficie-2); font-size: 12px; color: var(--texto-2); }
.apps-lista button:hover { background: var(--superficie-3); color: var(--texto); }

/* Ajustes */
.ajustes { display: flex; flex-direction: column; }
.ajuste { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 18px 0; border-bottom: 1px solid var(--borde); }
.ajuste:last-child { border-bottom: 0; }
.ajuste b { display: block; font-weight: 600; margin-bottom: 2px; }
.interruptor { appearance: none; width: 44px; height: 26px; border-radius: 13px; background: var(--superficie-3); position: relative; cursor: pointer; transition: background .3s; flex: none; margin: 0; }
.interruptor::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .45s var(--muelle); box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.interruptor:checked { background: var(--acento); }
.interruptor:checked::after { transform: translateX(18px); }

/* Bienvenida (sin vincular) */
.bienvenida { max-width: 940px; margin: 0 auto; padding: 70px 44px; text-align: center; animation: vista .6s var(--suave) both; }
.bienvenida > svg { width: 84px; height: 84px; }
.bienvenida h1 { font-size: 34px; letter-spacing: -.02em; margin: 22px 0 8px; font-weight: 600; }
.bienvenida > p { color: var(--texto-3); font-size: 15px; margin: 0 auto 38px; max-width: 560px; }
.caminos { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; text-align: left; }
.camino { display: flex; flex-direction: column; gap: 14px; }
.camino h2 { font-size: 18px !important; }
.moviles-wifi { display: flex; flex-direction: column; gap: 8px; }
.movil-wifi { all: unset; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--superficie-2); border: 1px solid transparent; transition: border-color .2s; }
.movil-wifi.si { border-color: var(--acento); }
.movil-wifi span:last-child { margin-left: auto; color: var(--texto-3); font-size: 12px; }
.buscando { display: flex; align-items: center; gap: 10px; color: var(--texto-3); font-size: 13px; }
.buscando::before { content: ""; flex: none; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--superficie-3); border-top-color: var(--acento); animation: girar .8s linear infinite; }
@keyframes girar { to { transform: rotate(360deg); } }
.cajas-codigo { display: flex; gap: 8px; justify-content: space-between; }
.cajas-codigo input { width: 100%; height: 56px; text-align: center; font: 500 24px "Montserrat"; border-radius: 12px; border: 1px solid var(--borde-2); background: var(--fondo); color: var(--texto); outline: none; transition: border-color .2s, box-shadow .2s; }
.cajas-codigo input:focus { border-color: var(--acento); box-shadow: 0 0 0 4px var(--acento-2); }
.cajas-codigo .sep { width: 10px; flex: none; }
.error { color: var(--rojo); font-size: 13px; min-height: 18px; }

/* Aviso flotante */
body.quieto .tesela, body.quieto .mensaje, body.quieto .w, body.quieto .registro div { animation: none; }
.aviso { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 30px); opacity: 0; background: var(--texto); color: var(--fondo); padding: 11px 18px; border-radius: 12px; font-weight: 600; font-size: 13px; transition: transform .45s var(--muelle), opacity .3s; z-index: 30; pointer-events: none; }
.aviso.visible { transform: translate(-50%, 0); opacity: 1; }

@media (max-width: 980px) {
  .app { grid-template-columns: 76px 1fr; }
  .lateral { padding: 22px 10px; align-items: center; }
  .marca b, .movil-mini, nav button span, nav .insignia, .ia-en-uso div, .equipo { display: none; }
  nav button { padding: 11px; }
  .hero, .rejilla-2, .caminos, .opciones-instalar, .pasos-guia { grid-template-columns: 1fr; }
  .vista { padding: 30px 26px; }
}
/* ---------- Encontrar mi móvil ---------- */
.tarjeta.encontrar { padding: 0; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr) 280px; }
.zona-mapa { min-height: 380px; position: relative; border-right: 1px solid var(--borde); }
.mapa { position: absolute; inset: 0; overflow: hidden; background: var(--superficie-2); animation: aparecer .5s var(--suave); }
.mapa .teselas { position: absolute; left: 50%; top: 50%; width: 1280px; height: 768px; }
.mapa .teselas img { position: absolute; width: 256px; height: 256px; opacity: 0; transition: opacity .5s var(--suave); user-select: none; }
.mapa .teselas img.cargada { opacity: 1; }
@media (prefers-color-scheme: dark) { .mapa .teselas img { filter: invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.6); } }
.mapa .precision { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); border-radius: 50%; background: color-mix(in srgb, var(--acento) 14%, transparent); border: 1px solid color-mix(in srgb, var(--acento) 45%, transparent); }
.mapa .marcador { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: var(--acento); border: 3px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
.mapa .marcador::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid var(--acento); animation: latido-mapa 2s var(--suave) infinite; }
@keyframes latido-mapa { from { transform: scale(1); opacity: .9; } to { transform: scale(3.2); opacity: 0; } }
@keyframes aparecer { from { opacity: 0; } to { opacity: 1; } }
.mapa .creditos { position: absolute; right: 8px; bottom: 6px; font-size: 10px; color: #333; background: rgba(255,255,255,.75); padding: 1px 6px; border-radius: 6px; }
.mapa .zooms { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; background: var(--superficie); border: 1px solid var(--borde); box-shadow: 0 4px 14px rgba(0,0,0,.2); }
.mapa .zooms button { appearance: none; border: 0; width: 36px; height: 36px; display: grid; place-items: center; background: none; color: var(--texto); cursor: pointer; transition: background .2s; }
.mapa .zooms button + button { border-top: 1px solid var(--borde); }
.mapa .zooms button:hover { background: var(--superficie-2); }
.mapa .zooms svg { width: 16px; height: 16px; }
.mapa.vacio { display: grid; place-items: center; }
.buscando-movil { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; max-width: 280px; padding: 20px; }
.buscando-movil .anillo { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--superficie-3); border-top-color: var(--acento); animation: girar 1s linear infinite; margin-bottom: 6px; }
@keyframes girar { to { transform: rotate(360deg); } }
.datos-encontrar { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.fila-dato { display: flex; flex-direction: column; gap: 3px; }
.fila-dato b { font-weight: 600; font-size: 15px; }
.fila-dato b.ok { color: var(--verde); }
.datos-encontrar > .boton { margin-top: auto; align-self: flex-start; }
.banda-perdido { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 12px; background: color-mix(in srgb, var(--rojo) 14%, transparent); color: var(--rojo); font-size: 13px; font-weight: 600; }
.banda-perdido .texto-perdido { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.banda-perdido .texto-perdido span { font-weight: 500; opacity: .85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.banda-perdido .boton { height: 30px; padding: 0 12px; font-size: 12px; }
.intrusos { display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 14px; background: var(--superficie-2); animation: aparecer .4s var(--suave); }
.intrusos img { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; flex: none; }
.texto-intrusos { display: flex; flex-direction: column; gap: 3px; min-width: 0; font-size: 13px; }
.acciones-encontrar { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 10px; padding: 16px 20px; border-top: 1px solid var(--borde); }
.acciones-encontrar .boton.peligro { margin-left: auto; }
.form-perdido { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 10px; padding: 0 20px 20px; animation: aparecer .35s var(--suave); }
.form-perdido > .boton { align-self: flex-start; }
.boton svg { width: 16px; height: 16px; }
@media (max-width: 860px) { .tarjeta.encontrar { grid-template-columns: 1fr; } .zona-mapa { border-right: 0; border-bottom: 1px solid var(--borde); } }
</style>

function colorDe(p) { const claro = matchMedia("(prefers-color-scheme: light)").matches; return (p?.acento || [])[claro ? 1 : 0] || "#7B6CF6"; }
// Cambia un texto solo si es distinto (sin tocar la pantalla si no hace falta).
// Huella de unos datos para saber si han cambiado (sin la marca de hora «t» del canal cifrado).
const firmaDe = (o) => JSON.stringify(o, (k, v) => (k === "t" ? undefined : v));
const ponerTexto = (n, t) => { if (n && n.textContent !== t) n.textContent = t; };
const horaCorta = (ms) => ms ? new Date(ms).toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" }) : "";

// ---------- Estado ----------
let estado = null, ajustes = {}, vinculado = null, vista = "", ia = null, mensajes = [], panel = null, cable = null, copia = null;

async function refrescar() {
  const d = await fetch("/api/estado").then((r) => r.json()).catch(() => null);
  if (!d) return;
  estado = d.estado; ajustes = d.ajustes || {};
  $("equipo").textContent = d.equipo || "";
  if (estado.vinculado !== vinculado) {
    vinculado = estado.vinculado;
    document.body.classList.toggle("sin-movil", !vinculado);
    // #v=ia o #v=ia&cajon=local abre esa sección (para revisar el diseño).
    const pide = new URLSearchParams(location.hash.slice(1));
    ir(pide.get("v") || (vinculado ? (vista && vista !== "bienvenida" ? vista : "inicio") : (vista === "cable" ? "cable" : "bienvenida")));
    if (pide.get("cajon")) setTimeout(() => ia && abrirCajon(pide.get("cajon")), 900);
    if (vinculado) { refrescarIa(); refrescarPanel(); refrescarMensajes(); }
  }
  pintarLateral();
  if (vista === "inicio") pintarEstadoInicio();
}

function pintarLateral() {
  const e = estado || {};
  $("mini-nombre").textContent = vinculado ? (e.nombre_movil || "Tu móvil") : "Sin vincular";
  $("mini-estado").classList.toggle("si", !!(vinculado && e.conectado));
  $("mini-texto").textContent = !vinculado ? "Vincula tu móvil" : e.conectado ? `Conectado · ${e.bateria ?? "—"} %${e.cargando ? " · cargando" : ""}` : (e.error || "Conectando…");
  $("mini-bateria").style.transform = `scaleX(${vinculado && e.bateria ? e.bateria / 100 : 0})`;
  document.querySelectorAll("#nav button").forEach((b) => {
    const solo = ["cable"].includes(b.dataset.v);
    b.classList.toggle("oculto", !vinculado && !solo && b.dataset.v !== "inicio");
  });
  const activo = ia?.proveedores?.find((p) => p.id === ia.activo);
  $("ia-en-uso").classList.toggle("oculto", !vinculado || !activo);
  if (activo) {
    $("ia-en-uso-logo").innerHTML = logoDe(activo.id);
    $("ia-en-uso-nombre").textContent = activo.nombre;
    document.documentElement.style.setProperty("--acento", colorDe(activo));
  }
  const n = mensajes.filter((m) => m.responder).length;
  $("n-mensajes").textContent = n; $("n-mensajes").classList.toggle("oculto", !vinculado || !n);
}

// ---------- Navegación ----------
function ir(v) {
  if (!vinculado && v !== "cable") v = "bienvenida";
  vista = v;
  document.querySelectorAll("#nav button").forEach((b) => b.classList.toggle("activo", b.dataset.v === v || (v === "bienvenida" && b.dataset.v === "inicio")));
  const m = $("main");
  m.replaceChildren(VISTAS[v]());
  // Las animaciones de entrada, solo al llegar a la sección; las actualizaciones no se animan.
  document.body.classList.remove("quieto");
  clearTimeout(ir.t); ir.t = setTimeout(() => document.body.classList.add("quieto"), 900);
  m.scrollTop = 0;
}
$("nav").onclick = (e) => { const b = e.target.closest("button"); if (b) ir(b.dataset.v); };
$("ia-en-uso").onclick = () => ir("ia");

function cabecera(titulo, sub, extra) {
  const c = el("div", "titulo-vista"), t = el("div");
  t.append(el("h1", null, titulo)); if (sub) t.append(el("p", null, sub));
  c.append(t); if (extra) c.append(extra);
  return c;
}
function boton(txt, fn, clase = "") {
  const b = el("button", "boton " + clase); b.innerHTML = txt;
  b.onclick = async () => { b.disabled = true; try { await fn(b); } catch (e) { aviso(e.message); } b.disabled = false; };
  return b;
}

// ---------- Encontrar mi móvil: mapa ----------
// Teselas de OpenStreetMap compuestas a mano (sin librerías): 5×3 alrededor del punto, centradas.
function mapa(lat, lon, precision, z) {
  const caja = el("div", "mapa");
  const n = 2 ** z, rad = (lat * Math.PI) / 180;
  const x = ((lon + 180) / 360) * n, y = ((1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2) * n;
  const tx = Math.floor(x), ty = Math.floor(y), px = (x - tx) * 256, py = (y - ty) * 256;
  const capa = el("div", "teselas");
  capa.style.marginLeft = `${-(512 + px)}px`; capa.style.marginTop = `${-(256 + py)}px`;
  for (let dy = -1; dy <= 1; dy++) for (let dx = -2; dx <= 2; dx++) {
    const t = document.createElement("img");
    t.src = `https://tile.openstreetmap.org/${z}/${(((tx + dx) % n) + n) % n}/${ty + dy}.png`;
    t.alt = ""; t.draggable = false;
    t.style.left = `${(dx + 2) * 256}px`; t.style.top = `${(dy + 1) * 256}px`;
    t.onload = () => t.classList.add("cargada");
    capa.append(t);
  }
  // Círculo de precisión (metros → píxeles a esta latitud y zoom) y el punto que late.
  const mpp = (156543.03392 * Math.cos(rad)) / n;
  const r = Math.max(14, Math.min(400, (precision || 0) / mpp));
  const circulo = el("div", "precision"); circulo.style.width = circulo.style.height = `${r * 2}px`;
  caja.append(capa, circulo, el("div", "marcador"), el("div", "creditos", "© OpenStreetMap"));
  return caja;
}

// Botón con icono (el() pone texto plano).
function conIcono(clase, html) { const b = el("button", clase); b.innerHTML = html; return b; }

function hace(ms) {
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if (s < 60) return "ahora mismo";
  if (s < 3600) return `hace ${Math.round(s / 60)} min`;
  if (s < 86400) return `hace ${Math.round(s / 3600)} h`;
  return `hace ${Math.round(s / 86400)} d`;
}

const VISTAS = {

    );
    t.append(acciones, formPerdido, formBorrar);
    v.append(t);

    function pintar(r) {
      ultimo = r;
      const e = r.estado || {}, u = e.ubicacion;
      zona.replaceChildren();
      if (u && u.lat != null) {
        const m = mapa(u.lat, u.lon, u.precision, zoom);
        const zooms = el("div", "zooms");
        zooms.append(
          Object.assign(conIcono("", ic("mas")), { onclick: () => { zoom = Math.min(19, zoom + 1); pintar(ultimo); } }),
          Object.assign(conIcono("", ic("menos")), { onclick: () => { zoom = Math.max(3, zoom - 1); pintar(ultimo); } }),
        );
        m.append(zooms);
        zona.append(m);
      } else {
        zona.innerHTML = `<div class="mapa vacio"><div class="buscando-movil"><b>Sin ubicación todavía</b><span class="suave">${r.vivo || r.conectado ? "El móvil no puede saber dónde está ahora (¿ubicación apagada?)." : "Cuando el móvil se conecte a internet, aparecerá aquí."}</span></div></div>`;
      }
      datos.replaceChildren();
      const estado = r.vivo ? "Conectado ahora" : r.conectado ? "Conectado" : r.visto ? `Visto ${hace(r.visto)}` : "Aún no se ha conectado";
      const filas = [
        ["Estado", estado, r.vivo || r.conectado ? "ok" : ""],
        ["Ubicación", u ? `${u.hace_s != null ? hace((r.cuando || Date.now()) - u.hace_s * 1000) : hace(r.cuando || Date.now())} · ±${Math.round(u.precision || 0)} m` : "—"],

      ];
      for (const [k, val, cls] of filas) {
        const f = el("div", "fila-dato");

        datos.append(enlace);
      }
      // Alguien ha fallado al desbloquear: la foto de la cámara frontal (si está activado en el móvil).
      if (e.intrusos?.length) {
        const caja = el("div", "intrusos");
        const ult = e.intrusos[0];
        if (ult.foto) {
          const img = document.createElement("img");
          img.src = `data:image/jpeg;base64,${ult.foto}`; img.alt = "";

        const txt = el("div", "texto-intrusos");

          el("b", null, e.intrusos.length === 1 ? "Intento de desbloqueo" : `${e.intrusos.length} intentos de desbloqueo`),
          el("span", "suave", e.intrusos.map((x) => hace(x.cuando)).join(" · ")),
        );
        caja.append(txt);
        datos.prepend(caja);

        const b = el("div", "banda-perdido");
        const txt = el("div", "texto-perdido");
        txt.append(el("b", null, "Modo perdido activado"));

        b.append(txt, boton("Quitar", () => hacer("perdido_fin"), "sec"));
        datos.prepend(b);
      }

      catch (e) { if (!ultimo) zona.innerHTML = `<div class="mapa vacio"><div class="buscando-movil"><b>No se ha podido buscar</b><span class="suave">${e.message}</span></div></div>`; }

    }
    actualizar.onclick = cargar;
    cargar();

    clearInterval(VISTAS.relojEncontrar);

  bienvenida() {

    const caminos = el("div", "caminos");

    const host = el("input", "campo"); host.id = "host"; host.placeholder = "O escribe su dirección (la enseña el móvil)";
    const cajas = el("div", "cajas-codigo");
    for (let i = 0; i < 6; i++) { if (i === 3) cajas.append(el("span", "sep")); const c = el("input"); c.maxLength = 1; c.inputMode = "numeric"; cajas.append(c); }

  ponerTexto(nota, !d.activa ? "Lo nuevo de la cámara y de Documentos, cuando el móvil está en tu Wi-Fi."
    : e.copiando ? `Copiando… ${e.hechos} de ${e.total}` : e.error ? `No se pudo copiar: ${e.error}`
    : e.ultima ? `En ${d.carpeta} · última copia a las ${horaCorta(e.ultima)}${e.nuevos ? ` (${e.nuevos} nuevos)` : ""}` : `En ${d.carpeta}`);
}
setInterval(() => { if (vista === "ajustes") refrescarCopia(); }, 4000);

// ---------- Buscar móviles (sin vincular) ----------
let elegido = "";
async function buscar() {
  if (vinculado || vista !== "bienvenida") return;
  const lista = await fetch("/api/buscar").then((r) => r.json()).catch(() => []);
  const caja = $("moviles"); if (!caja) return;
  caja.replaceChildren(...lista.map((m) => {
    const b = el("button", "movil-wifi" + (m.host === elegido ? " si" : "")); b.innerHTML = ic("movil");
    b.append(el("b", null, m.nombre), el("span", null, m.host));
    b.onclick = () => { elegido = m.host; $("host").value = m.host; buscar(); document.querySelector(".cajas-codigo input")?.focus(); };
    return b;
  }));
  $("buscando").classList.toggle("oculto", lista.length > 0);
  if (lista.length === 1 && !$("host").value) { elegido = lista[0].host; $("host").value = elegido; }
  setTimeout(buscar, 4000);
}

refrescar();
setInterval(refrescar, 2000);
</script>
